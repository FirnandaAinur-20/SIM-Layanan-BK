<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistem Informasi Layanan BK</title>
<style>
:root{--navy:#173b57;--blue:#286b8b;--teal:#2a9d8f;--bg:#f3f7fa;--ink:#203040;--muted:#64748b;--line:#dce5ec}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(120deg,var(--navy),var(--blue));color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:20px;font-weight:bold}.brand small{display:block;font-size:12px;font-weight:normal;margin-top:5px;color:#dcebf4}main{max-width:1100px;margin:28px auto;padding:0 18px}.login{max-width:450px;margin:55px auto;background:white;border:1px solid var(--line);border-radius:16px;padding:26px}.layout{display:grid;grid-template-columns:210px 1fr;gap:20px}.sidebar,.panel,.stat{background:white;border:1px solid var(--line);border-radius:14px}.sidebar{padding:12px;height:max-content}.nav{display:block;width:100%;text-align:left;background:transparent;color:#425466;border:0;border-radius:8px;padding:11px;cursor:pointer;margin:3px 0}.nav.active,.nav:hover{background:#eaf3f7;color:var(--navy)}.content{min-width:0}.panel{padding:20px;margin-bottom:16px}.panel h3{margin-top:0}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:bold}.field input,.field select,.field textarea{padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}.field textarea{min-height:80px}.btn{background:var(--blue);color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold}.secondary{background:#e7eef3;color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{padding:16px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:25px;color:var(--navy);margin-top:7px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:#f7fafc}.notice{background:#fff7e4;color:#79551a;padding:12px;border-radius:9px;font-size:13px;line-height:1.5;margin:12px 0}.tag{background:#e5f5ef;color:#207b66;padding:4px 8px;border-radius:20px;font-size:11px}.muted{color:var(--muted);font-size:13px}.empty{text-align:center;padding:18px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
</style></head><body><header><div class="brand">☘ Sistem Informasi Layanan BK<small>Layanan Bimbingan dan Konseling Berbasis Web</small></div><div id="who"></div></header><main id="app"></main><footer>Prototype pembelajaran • Jangan masukkan data konseling nyata atau informasi pribadi sensitif.</footer>
<script>
const $=id=>document.getElementById(id),app=$('app'),roles={'Siswa':['Dashboard','Ajukan Konseling','Jadwal Saya','Notifikasi'],'Guru BK':['Dashboard','Data Siswa','Permintaan Konseling','Jadwal','Catatan Konseling','Kasus & Tindak Lanjut','Laporan','Privasi'],'Wali Kelas':['Dashboard','Rujukan Siswa','Informasi Relevan'],'Kepala Sekolah':['Dashboard','Laporan'],'Orang Tua':['Dashboard','Informasi Perkembangan']};
let user=null,active='Dashboard',students=[{id:'S-001',name:'Alya Putri',kelas:'VIII A'},{id:'S-002',name:'Raka Pratama',kelas:'IX B'},{id:'S-003',name:'Nadia Safitri',kelas:'VII C'}],requests=[],schedules=[],notes=[],alerts=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){ $('who').innerHTML='';app.innerHTML='<section class="login"><h2>Masuk ke Sistem</h2><p class="muted">Pilih peran untuk mencoba aplikasi.</p><div class="field"><label>Nama pengguna</label><input id="nm" value="Pengguna Demo"></div><div class="field"><label>Masuk sebagai</label><select id="rl">'+Object.keys(roles).map(x=>'<option>'+x+'</option>').join('')+'</select></div><button class="btn" style="width:100%" onclick="signin()">Masuk</button><div class="notice">Ini prototipe demonstrasi. Belum menggunakan database, server, atau autentikasi sungguhan.</div></section>'}
function signin(){user={name:$('nm').value||'Pengguna Demo',role:$('rl').value};active='Dashboard';render()}
function signout(){user=null;login()}
function go(n){active=n;render()}
function table(head,rows){return rows.length?'<table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<div class="empty">Belum ada data.</div>'}
function stats(){return '<div class="stats"><div class="stat"><span>Data siswa contoh</span><strong>'+students.length+'</strong></div><div class="stat"><span>Permintaan konseling</span><strong>'+requests.length+'</strong></div><div class="stat"><span>Jadwal tercatat</span><strong>'+schedules.length+'</strong></div></div>'}
function render(){if(!user)return login();$('who').innerHTML=esc(user.name)+' · '+esc(user.role)+' <button class="btn secondary" onclick="signout()">Keluar</button>';app.innerHTML='<div class="layout"><aside class="sidebar">'+roles[user.role].map(n=>'<button class="nav '+(active===n?'active':'')+'" onclick="go(\''+n+'\')">'+n+'</button>').join('')+'</aside><section class="content"><h2>'+active+'</h2><p class="muted">Kelola layanan BK sesuai hak akses pengguna.</p>'+page()+'</section></div>'}
function page(){let r=user.role;
if(active==='Dashboard')return stats()+'<div class="panel"><h3>Selamat datang, '+esc(user.name)+'</h3><p>Sistem membantu pengajuan konseling, penjadwalan, pencatatan layanan, pemantauan, dan pelaporan.</p><div class="notice">Alur: pengajuan siswa → pemeriksaan Guru BK → penjadwalan → konseling → tindak lanjut → laporan. Data demo hanya tersimpan selama halaman terbuka.</div></div>';
if(active==='Ajukan Konseling')return '<div class="panel"><h3>Pengajuan Konseling</h3><div class="field"><label>Topik umum</label><select id="topic"><option>Akademik / belajar</option><option>Pergaulan</option><option>Rencana pendidikan</option><option>Pengembangan diri</option><option>Lainnya</option></select></div><div class="field"><label>Tanggal yang diinginkan</label><input id="wish" type="date"></div><div class="field"><label>Catatan singkat (hindari detail sensitif)</label><textarea id="detail" placeholder="Kebutuhan secara umum"></textarea></div><button class="btn" onclick="requestHelp()">Kirim pengajuan</button></div>';
if(active==='Permintaan Konseling')return '<div class="panel"><h3>Daftar Permintaan</h3>'+table(['Siswa','Topik','Tanggal','Status','Tindakan'],requests.map((x,i)=>[esc(x.student),esc(x.topic),esc(x.date||'-'),esc(x.status),'<button class="btn" onclick="makeSchedule('+i+')">Jadwalkan</button>']))+'</div>';
if(active==='Jadwal'||active==='Jadwal Saya')return '<div class="panel"><h3>Jadwal Konseling</h3>'+table(['Siswa','Tanggal','Waktu','Status'],schedules.filter(x=>r!=='Siswa'||x.student===user.name).map(x=>[esc(x.student),esc(x.date),esc(x.time),'<span class="tag">Terjadwal</span>']))+'</div>';
if(active==='Data Siswa')return '<div class="panel"><h3>Data Siswa Contoh</h3><p class="muted">Gunakan data fiktif saja.</p>'+table(['ID','Nama','Kelas'],students.map(x=>[x.id,esc(x.name),esc(x.kelas)]))+'<h3>Tambah siswa</h3><div class="field"><label>Nama</label><input id="sn"></div><div class="field"><label>Kelas</label><input id="sk"></div><button class="btn" onclick="addStudent()">Tambah</button></div>';
if(active==='Catatan Konseling')return '<div class="panel"><h3>Catatan Layanan Demo</h3><div class="notice">Jangan masukkan catatan konseling nyata. Sistem produksi wajib membatasi akses dan melindungi data.</div><div class="field"><label>Nama siswa (contoh)</label><input id="nn"></div><div class="field"><label>Ringkasan tindak lanjut umum</label><textarea id="nt"></textarea></div><button class="btn" onclick="addNote()">Simpan</button><h3>Catatan sesi ini</h3>'+table(['Siswa','Ringkasan'],notes.map(x=>[esc(x.name),esc(x.text)]))+'</div>';
if(active==='Kasus & Tindak Lanjut')return '<div class="panel"><h3>Rencana Tindak Lanjut</h3><div class="field"><label>Rencana umum</label><textarea id="follow"></textarea></div><button class="btn" onclick="addAlert()">Simpan pengingat</button><ul>'+alerts.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
if(active==='Laporan')return '<div class="panel"><h3>Ringkasan Layanan</h3>'+stats()+'<p>Total catatan demo: '+notes.length+'. Laporan tidak menampilkan isi konseling sensitif.</p><button class="btn" onclick="csv()">Unduh laporan CSV</button></div>';
if(active==='Privasi')return '<div class="panel"><h3>Keamanan dan Etika</h3><ul><li>Autentikasi dan hak akses sesuai peran.</li><li>Catatan konseling hanya untuk pihak berwenang.</li><li>Enkripsi data dan kata sandi pada sistem produksi.</li><li>Pencadangan dan pencatatan aktivitas.</li><li>Pembagian informasi sesuai kebijakan dan persetujuan.</li></ul></div>';
if(active==='Rujukan Siswa')return '<div class="panel"><h3>Rujukan kepada Guru BK</h3><div class="field"><label>Nama siswa contoh</label><input id="refn"></div><div class="field"><label>Alasan umum</label><textarea id="refr"></textarea></div><button class="btn" onclick="refer()">Kirim rujukan</button></div>';
if(active==='Informasi Relevan'||active==='Informasi Perkembangan')return '<div class="panel"><h3>Informasi yang Diizinkan</h3><p>Informasi perkembangan hanya dibagikan sesuai kebijakan sekolah, persetujuan, dan hak akses. Catatan pribadi konseling tidak ditampilkan.</p></div>';
if(active==='Notifikasi')return '<div class="panel"><h3>Notifikasi</h3><ul>'+alerts.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
return '<div class="panel">Menu tersedia untuk peran '+esc(r)+'.</div>'}
function requestHelp(){requests.push({student:user.name,topic:$('topic').value,date:$('wish').value,status:'Menunggu'});alerts.push('Pengajuan konseling baru dari '+user.name);alert('Pengajuan demo tersimpan.');go('Dashboard')}
function makeSchedule(i){let d=prompt('Tanggal (YYYY-MM-DD)');if(!d)return;let t=prompt('Waktu (contoh 10:00)','10:00')||'10:00';schedules.push({student:requests[i].student,date:d,time:t});requests[i].status='Terjadwal';alerts.push('Jadwal '+requests[i].student+' pada '+d+' '+t);render()}
function addStudent(){if(!$('sn').value||!$('sk').value)return alert('Lengkapi data.');students.push({id:'S-'+String(students.length+1).padStart(3,'0'),name:$('sn').value,kelas:$('sk').value});render()}
function addNote(){if(!$('nn').value||!$('nt').value)return alert('Lengkapi data.');notes.push({name:$('nn').value,text:$('nt').value});render()}
function addAlert(){if(!$('follow').value)return;alerts.push($('follow').value);render()}
function refer(){if(!$('refn').value||!$('refr').value)return;alerts.push('Rujukan: '+$('refn').value+' — '+$('refr').value);alert('Rujukan demo dicatat.');go('Dashboard')}
function csv(){let rows=[['Siswa','Topik','Tanggal','Status'],...requests.map(x=>[x.student,x.topic,x.date,x.status])],v=rows.map(a=>a.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/csv'}));a.download='laporan-bk-demo.csv';a.click();URL.revokeObjectURL(a.href)}
login();
</script></body></html>
